<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shotByT | Coming Soon</title>
    <link rel="icon" type="image/png" href="favicon.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.07),
                transparent 70%
            );
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 30px;
            z-index: 1;
            animation: fadeIn 1.2s ease forwards;
        }

        .logo {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -3px;
        }

        .logo span {
            color: #888;
            font-weight: 300;
        }

        .line {
            width: 45px;
            height: 2px;
            background: #f5f5f5;
            margin: 28px auto;
        }

        h2 {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        p {
            color: #888;
            font-size: 0.95rem;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #555;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1 class="logo">shotBy<span>T.</span></h1>

        <div class="line"></div>

        <h2>Coming Soon</h2>

        <p>
            Recording the world from a different perspective.<br>
            Something worth capturing.
        </p>
    </main>

    <footer class="footer">
        © 2026 shotByT
    </footer>
</body>
</html>
